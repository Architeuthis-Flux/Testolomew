; Testolomew - the Jumperless V6 idea test bed (nanoCH32H417 dev board).
;
;   pio run                      build the firmware
;   pio run -t upload            flash through the board's onboard WCH-LinkE
;   pio device monitor           console (the WCH-LinkE's serial port, 115200)
;   pio test -e native           host-side tests (no board needed)

[platformio]
default_envs = testolomew

[env:testolomew]
; Pinned to a specific platform commit, same reason as JumperlOS pins its
; platform: local builds stay reproducible while the (very new) CH32H4 Arduino
; core keeps moving. This commit is develop HEAD on 2026-09-17, four days after
; the CH32H4 Arduino core was merged. Bump it deliberately.
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git#8cf3b51c0ee537756a04c28336f1466e03424020
framework = arduino
; The nanoCH32H417 carries the same CH32H417QEU6 as WCH's EVT board, so the EVT
; board definition is used as-is. What differs is the wiring, and that lives in
; src/board/BoardPins.h, not in a board file.
board = ch32h417qeu6_evt_r0

; Onboard WCH-LinkE: flashing, debugging, and a serial port wired to USART1
; (PA9/PA10). Serial goes there so the console works before (and without) USB
; enumerating. Delete this line to make Serial the USB CDC port instead.
board_build.serial = uart
; Flash with wlink, not OpenOCD (upload_protocol = wch-link). OpenOCD writes the
; image and then crashes on the reset ("Unsupported register", exit -11),
; leaving the chip halted; the Arduino core's own test harness uses wlink for
; this chip and warns against mixing the two. Seen 2026-09-17, WCH-LinkE v2.20.
upload_protocol = wlink
debug_tool = wch-link
monitor_speed = 115200
; This board's WCH-LinkE. Named because a Raspberry Pi Debug Probe is usually on
; the same computer and PlatformIO would otherwise pick whichever it sees first.
monitor_port = /dev/cu.usbmodem85298F060AC72

extra_scripts =
	; every feature folder under src/ goes on the include path (src/ keeps the
	; main files at the top level, feature files in folders - no folder names
	; in #includes). Same script as JumperlOS.
	pre:scripts/src_subdirs_include.py

build_flags =
	-Isrc/

lib_deps =
	; only the framebuffer canvas and drawing/text of GFX are used (the LCD is
	; pushed by src/display/ST7789.cpp); BusIO is GFX's own dependency.
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit BusIO@^1.17.4

[env:native]
; Host build of the pure-math parts (no Arduino) for `pio test -e native`.
platform = native
build_flags = -Isrc/magfit/ -Isrc/rowcount/ -Isrc/common/ -std=c++11
build_src_filter = -<*> +<magfit/MagFit.cpp> +<rowcount/RowGrid.cpp>
test_build_src = yes
